name: one-shot special-selection migration
# retry-after-v0.2-source-version-fix
# retry-after-lossless-boolean-fix
# retry-after-shell-wrapper-fix

on:
  push:
    branches:
      - reaudit-2027-v0.1
    paths:
      - .github/workflows/migrate-special-selection-flags.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reaudit-2027-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Migrate canonical masters
        run: python scripts/migrate_special_selection_flags_2027.py
      - name: Validate source and unified build
        run: |
          python -m unittest tests.test_validator tests.test_unified_build
          bash scripts/validate_operations
          sh scripts/build_unified
      - name: Commit migration result
        run: |
          git config user.name "early-admissions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/canonical data/operations
          git diff --cached --stat
          git commit -m "apply special-selection flags and Tokyo Gakugei expansion"
          git push origin HEAD:reaudit-2027-v0.1
