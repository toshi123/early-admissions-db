name: one-shot UEC 2027 re-audit

on:
  push:
    branches:
      - reaudit-2027-v0.1
    paths:
      - .github/workflows/audit-uec-2027.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reaudit-2027-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Apply UEC audit
        run: python scripts/audit_uec_2027.py
      - name: Validate
        run: |
          python -m unittest tests.test_validator tests.test_unified_build
          bash scripts/validate_operations
          sh scripts/build_unified
      - name: Commit result
        run: |
          git config user.name "early-admissions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/canonical data/operations
          git diff --cached --stat
          git commit -m "apply UEC 2027 re-audit"
          git push origin HEAD:reaudit-2027-v0.1
